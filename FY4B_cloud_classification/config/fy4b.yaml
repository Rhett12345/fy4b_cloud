# FY-4B AGRI 云产品数据处理配置

# L2 产品目录映射
product_dirs:
  L1B: L1_HDF
  CLM: L2_CLM_DISK      # cloud mask
  CLP: L2_CLP_DISK      # cloud phase
  CLOD: L2_CLOD_DISK    # cloud optical depth
  CTH: L2_CTH_DISK      # cloud top height
  CTT: L2_CTT_DISK      # cloud top temperature
  CTP: L2_CTP_DISK      # cloud top pressure
  CLT: L2_CLT_DISK      # cloud type
  CPD: L2_CPD_DISK      # cloud optical thickness + effective radius

# L2 变量名候选（兼容不同批次数据格式）
l2_var_candidates:
  cloud_mask:
    - CLM
    - Cloud_Mask
    - CloudMask
    - cloud_mask
    - NOMCloudMask
    - Cloud_Detection
    - CloudDetection
  cloud_phase:
    - CLP
    - Cloud_Phase
    - CloudPhase
    - cloud_phase
    - NOMCloudPhase
  cloud_optical_depth:
    - COT
    - CLOD
    - Cloud_Optical_Depth
    - CloudOpticalDepth
    - cloud_optical_depth
    - Optical_Depth
    - COD
  cloud_top_height:
    - CTH
    - Cloud_Top_Height
    - CloudTopHeight
    - cloud_top_height
    - NOMCloudTopHeight
  cloud_top_temperature:
    - CTT
    - Cloud_Top_Temperature
    - CloudTopTemperature
    - cloud_top_temperature
    - NOMCloudTopTemperature
  cloud_top_pressure:
    - CTP
    - Cloud_Top_Pressure
    - CloudTopPressure
    - cloud_top_pressure
    - NOMCloudTopPressure
  cloud_type:
    - CLT
    - Cloud_Type
    - CloudType
    - cloud_type
    - NOMCloudType
  cloud_effective_radius:
    - CER
    - Cloud_Effective_Radius
    - CloudEffectiveRadius
    - cloud_effective_radius
    - Effective_Radius
    - REFF
  cloud_optical_thickness:
    - COT
    - Cloud_Optical_Thickness
    - CloudOpticalThickness
    - cloud_optical_thickness

